name: Build Vita VPK

on:
  push:
    branches: [main, m0-decomp-smoke-test, m1-real-bundle-probe, m2-tpk-metadata, m3-render-mw-logo, m4-texture-viewer, m5-jdlz-globalb, m6-globalb-tpk-index, m7-globalb-texture-browser]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl

      - name: Bootstrap VitaSDK
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/vitasdk/vdpm/v0.1.1/bootstrap-vitasdk.sh -o /tmp/bootstrap-vitasdk.sh
          chmod +x /tmp/bootstrap-vitasdk.sh
          VITASDK="$HOME/vitasdk" /tmp/bootstrap-vitasdk.sh
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Install Vita libraries
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          export VDPM_NONINTERACTIVE=1
          "$VITASDK/bin/vdpm" install libvita2d

      - name: Configure
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          cmake -S . -B build-vita \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -G Ninja

      - name: Build
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          cmake --build build-vita -j2
          test -f build-vita/nfsmw_vita_port.vpk
          test -f build-vita/nfsmw_vita_port
          ls -lh build-vita/nfsmw_vita_port.vpk build-vita/nfsmw_vita_port

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Vita-Port-M7
          path: build-vita/nfsmw_vita_port.vpk
          if-no-files-found: error

      - name: Upload exact debug ELF
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Vita-Port-M7-symbols
          path: |
            build-vita/nfsmw_vita_port
            build-vita/*.velf
            build-vita/*.map
          if-no-files-found: warn
