name: Build Vita VPK

permissions:
  contents: write

on:
  push:
    branches: [main, m0-decomp-smoke-test, m1-real-bundle-probe, m2-tpk-metadata, m3-render-mw-logo, m4-texture-viewer, m5-jdlz-globalb, m6-globalb-tpk-index, m7-globalb-texture-browser, m8-p8-palette, m10-playable-port, m11-direct-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl

      - name: Bootstrap VitaSDK
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/vitasdk/vdpm/v0.1.1/bootstrap-vitasdk.sh -o /tmp/bootstrap-vitasdk.sh
          chmod +x /tmp/bootstrap-vitasdk.sh
          VITASDK="$HOME/vitasdk" /tmp/bootstrap-vitasdk.sh
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Install Vita libraries
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          export VDPM_NONINTERACTIVE=1
          "$VITASDK/bin/vdpm" install libvita2d

      - name: Configure
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          cmake -S . -B build-vita \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -G Ninja

      - name: Build
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          set -o pipefail
          cmake --build build-vita -j2 2>&1 | tee build.log
          test -f build-vita/nfsmw_vita_port.vpk
          test -f build-vita/nfsmw_vita_port
          ls -lh build-vita/nfsmw_vita_port.vpk build-vita/nfsmw_vita_port

      - name: Capture M11 build failure
        if: failure() && github.ref_name == 'm11-direct-port'
        shell: bash
        run: |
          mkdir -p docs
          {
            echo "M11 CI failure log"
            echo
            tail -n 160 build.log 2>/dev/null || true
          } > docs/m11-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/m11-ci.log
          if ! git diff --cached --quiet; then
            git commit -m "CI capture M11 build failure"
            git push origin HEAD:m11-direct-port
          fi

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Vita-Port-M10
          path: build-vita/nfsmw_vita_port.vpk
          if-no-files-found: error

      - name: Upload exact debug ELF
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Vita-Port-M10-symbols
          path: |
            build-vita/nfsmw_vita_port
            build-vita/*.velf
            build-vita/*.map
          if-no-files-found: warn
